<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoção de Cães</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div>
        <h1>Formulário de Adoção de Cães</h1>
        <p>Preencha as informações:</p>
        <br>
    </div>
    
    <form>
        <div>
            <label for="nome">Nome Completo</label>
            <input type="text" nome="nome" id="nome">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="text" nome="email" id="email">
        </div>
        <div>
            <label for="telefone">Telefone</label>
            <input type="tel" nome="telefone" id="telefone" placeholder="(00) 90000-0000">
        </div>
        <div>
            <label for="cpf">CPF</label>
            <input type="text" nome="cpf" id="cpf" placeholder="000.000.000-00">
        </div>
    </form>
    

</body>
</html>
