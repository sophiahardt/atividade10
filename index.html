<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoção de Cães</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div>
        <h1>Formulário de Adoção de Cães</h1>
        <p>Preencha as informações:</p>
        <br>
    </div>
    
    <form id="form_adocao">
        <div>
            <label for="nome">Nome Completo</label>
            <input type="text" name="nome" id="nome" minlength="3" required>
        </div>
        <br>
        <div>
            <label for="email">Email</label>
            <input type="text" name="email" id="email">
        </div>
        <br>
        <div>
            <label for="telefone">Telefone</label>
            <input type="tel" name="telefone" id="telefone" placeholder="(00) 90000-0000" pattern="[\d\s\-\(\)]{8,}" required>
        </div>
        <br>
        <div>
            <label for="cpf">CPF</label>
            <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00" required>
        </div>
        <br>
        <div>
            <label for="idade">Idade</label>
            <input type="number" name="idade" id="idade" placeholder="Ex: 23" required>
        </div>
        <br>
        <div>
            <label for="cidade">Cidade</label>
            <input type="text" name="cidade" id="cidade" required>
        </div>
        <br>
        <div>
            <label for="moradia">Tipo de moradia</label>
            <select id="moradia" name="moradia" required onchange="verificarMoradia()">
                <option selected disabled value="">Selecione</option>
                <option value="Casa">Casa</option>
                <option value="Apartamento">Apartamento</option>
            </select>
        </div>
        <div id="permite_animais">
            <label>O condomínio permite animais?</label>
            <label>
                <input type="radio" name="permite_animais" value="sim">Sim
            </label>
            <label>
                <input type="radio" name="permite_animais" value="nao">Não
            </label>
        </div>
        <br>
        <fieldset id="tem_quintal">
            <label for="quintal">Possui quintal?</label>
            <label>
                <input type="radio" name="tem_quintal" value="sim" required>Sim
            </label>
            <label>
                <input type="radio" name="tem_quintal" value="nao">Não
            </label>
        </fieldset>
        <div id="quintal_seguro">
            <label>O quintal é seguro?</label>
            <label>
                <input type="radio" name="quintal" value="sim">Sim
            </label>
            <label>
                <input type="radio" name="quintal" value="nao">Não
            </label>
        </div>
        <br>
        <div>
            <label>Já teve pet antes?</label>
            <label>
                <input type="radio" id="teve_pet_sim" name="teve_pet" value="sim" required>Sim
            </label>
            <label>
                <input type="radio" id="teve_pet_nao" name="teve_pet" value="nao">Não
            </label>
        </div>
        <br>
        <div>
            <label for="horas">Quantas horas o animal ficará sozinho por dia?</label>
            <input type="number" name="horas" id="horas" min="0" step="1" placeholder="Ex: 4">
        </div>
        <br>
        <div>
            <label>Motivo da adoção</label>
            <br>
            <textarea id="motivo" name="motivo" minlength="10" required placeholder="Explique o motivo da adoção (mínimo 10 caracteres)"></textarea>
        </div>
        <br>
        <div>
            <label>
                <a href="termo.de.responsabilidade">Termo de responsabilidade</a>
                <br>
                <input type="checkbox" id="termo" required> Aceito o termo de responsabilidade
            </label>
        </div>
        <br>
        <div>
            <button type="submit">Enviar</button>
        </div>
    </form>

    

</body>
</html>
